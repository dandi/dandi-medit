name: Preview Deploy

# Deploys the preview built by the secretless Preview Build workflow to
# Cloudflare Pages and comments the URL on the pull request.
#
# The split into two workflows is what makes fork PRs work: a pull_request
# run of fork code never receives repository secrets, whereas this
# workflow_run-triggered workflow runs from the workflow file on main, in
# the base repository's context, with access to them.
#
# This workflow must never check out or execute code from the PR. It only
# downloads the built static site and pushes it to Cloudflare Pages, so the
# Cloudflare token is never exposed to the PR's code.

on:
  workflow_run:
    workflows: ['Preview Build']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run id of the Preview Build run whose artifact to deploy'
        required: true

permissions:
  actions: read
  pull-requests: write

concurrency: preview-deploy-${{ github.event.workflow_run.head_branch || inputs.run_id }}

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve build run
        id: run
        uses: actions/github-script@v7
        with:
          script: |
            let run;
            if (context.eventName === 'workflow_run') {
              run = context.payload.workflow_run;
            } else {
              const runId = Number('${{ inputs.run_id }}');
              const { data } = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
              });
              run = data;
              if (run.name !== 'Preview Build' || run.conclusion !== 'success') {
                core.setFailed(`Run ${runId} is not a successful Preview Build run`);
                return;
              }
            }
            core.setOutput('run_id', run.id);
            core.setOutput('head_branch', run.head_branch);
            core.setOutput('head_sha', run.head_sha);

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: preview-dist
          path: dist
          run-id: ${{ steps.run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The branch name comes from a fork, so it is passed through the
      # environment rather than interpolated into the script. pipefail makes
      # a failed deploy or a missing alias URL fail the step.
      - name: Deploy preview to Cloudflare Pages
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEAD_BRANCH: ${{ steps.run.outputs.head_branch }}
        run: |
          npx wrangler pages deploy dist --project-name dandi-medit --branch "$HEAD_BRANCH" 2>&1 | tee /tmp/deploy-output.txt
          PREVIEW_URL=$(grep 'Deployment alias URL' /tmp/deploy-output.txt | grep -oP 'https://[^\s]+')
          test -n "$PREVIEW_URL"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      # The workflow_run payload's pull_requests array is empty for fork
      # PRs, so the PR is found from the head commit instead.
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.deploy.outputs.preview_url }}';
            const headSha = '${{ steps.run.outputs.head_sha }}';
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: headSha,
            });
            const pr = prs.find(
              (p) => p.state === 'open' && p.base.repo.full_name === `${context.repo.owner}/${context.repo.repo}`,
            );
            if (!pr) {
              console.log('No open PR found for head sha, skipping comment.');
              return;
            }
            const body = `**Preview deployment ready**\n\n${previewUrl}\n\n<sub>Built from ${headSha.substring(0, 7)}. The chat and fetch_url need the preview origin to be allowed by their backends; see proxy/README.md.</sub>`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.includes('Preview deployment ready'));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, body });
            }
